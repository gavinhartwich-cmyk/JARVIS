<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JARVIS</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* [2026-09-02] Native shell change: the HUD used to fill an opaque Edge
     app-mode window (#04070d background below). Hosted inside the native
     WPF overlay (see native-hud/), the window itself is a fully
     transparent, click-through, borderless layer - so body must be
     transparent too, or the "native" overlay would just show a black
     rectangle instead of floating rings. Kept #bgFallback (below) so this
     file still looks right if ever opened directly in a normal browser
     tab, where "transparent" would otherwise mean "page background". */
  #bgFallback {
    position: fixed;
    inset: 0;
    background: #04070d;
    z-index: -1;
    opacity: 0;
  }
  body.browser-fallback #bgFallback { opacity: 1; }

  #stage {
    position: relative;
    width: 340px;
    height: 340px;
  }
  svg { position: absolute; inset: 0; overflow: visible; }

  /* --- Glow behind everything, breathes with state --- */
  #glow {
    position: absolute;
    inset: 40px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56,214,255,0.35) 0%, rgba(56,214,255,0) 70%);
    filter: blur(4px);
    animation: breatheIdle 4s ease-in-out infinite, flicker 7s ease-in-out infinite;
  }
  /* Subtle, irregular flicker layered on top of the calm breathing cycle -
     a perfectly smooth sine breathe reads as a loading spinner; a little
     asymmetric flutter is what makes idle look like a live system
     ticking over, not a paused animation. */
  @keyframes flicker {
    0%, 100% { filter: blur(4px) brightness(1); }
    38% { filter: blur(4px) brightness(1.05); }
    41% { filter: blur(4px) brightness(0.97); }
    63% { filter: blur(4px) brightness(1.08); }
    68% { filter: blur(4px) brightness(1); }
  }

  /* --- Ring layers --- */
  #ringTicks { animation: spin 40s linear infinite; transform-origin: 50% 50%; }
  #ringDashed { animation: spin 22s linear infinite reverse; transform-origin: 50% 50%; }
  #ringSweep { animation: spin 3s linear infinite; transform-origin: 50% 50%; }
  #ringSegments { animation: spin 16s linear infinite reverse; transform-origin: 50% 50%; }
  #ringSatellites { animation: spin 9s linear infinite; transform-origin: 50% 50%; }
  #core { animation: spin 5s linear infinite reverse, corePulse 2.2s ease-in-out infinite; transform-origin: 50% 50%; }

  .arc { stroke: #3fd8ff; fill: none; filter: drop-shadow(0 0 4px rgba(63,216,255,0.85)); }
  .tick { stroke: #2fb8e6; fill: none; opacity: 0.75; }
  .segment { stroke: #2fb8e6; fill: none; opacity: 0.55; filter: drop-shadow(0 0 3px rgba(63,216,255,0.6)); }
  .satellite { fill: #3fd8ff; filter: drop-shadow(0 0 4px rgba(63,216,255,0.9)); }

  #core circle { fill: none; stroke: #3fd8ff; opacity: 0.8; }
  @keyframes corePulse {
    0%, 100% { opacity: 0.6; transform: scale(0.94); }
    50% { opacity: 1; transform: scale(1.06); }
  }

  #centerText {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #bdf3ff;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 20px;
    letter-spacing: 4px;
    text-shadow: 0 0 8px rgba(63,216,255,0.9), 0 0 18px rgba(63,216,255,0.5);
  }
  #stateLabel {
    position: absolute;
    bottom: 6px;
    left: 0;
    right: 0;
    text-align: center;
    color: #5fb3cc;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.8;
  }
  #readout {
    position: absolute;
    top: -6px;
    left: 10%;
    right: 10%;
    text-align: center;
    color: #4a92ab;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 9px;
    letter-spacing: 1px;
    opacity: 0.65;
    /* [ADDED 2026-09-03] Real activity text ("Searching the web for...")
       can be far longer than the old fixed short words this element was
       originally sized for - keep it to one line with an ellipsis rather
       than risk wrapping into (and visually breaking) the rings above it,
       since there's no way to verify the real rendered layout from here. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Waveform bars under the center text - only meaningful during
     "speaking" (no real amplitude data is piped in yet, see the script
     below for the honest disclosure on that), but the animated bars
     read as "audio is happening" far better than a static label does. */
  #waveform {
    position: absolute;
    bottom: 26px;
    left: 0;
    right: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
    height: 16px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  #waveform .bar {
    width: 3px;
    background: #58ffc8;
    border-radius: 1px;
    box-shadow: 0 0 4px rgba(88,255,200,0.8);
    animation: bar 0.9s ease-in-out infinite;
  }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes breatheIdle {
    0%, 100% { opacity: 0.45; transform: scale(0.96); }
    50% { opacity: 0.7; transform: scale(1.02); }
  }
  @keyframes breatheListening {
    0%, 100% { opacity: 0.7; transform: scale(1.0); }
    50% { opacity: 1; transform: scale(1.08); }
  }
  @keyframes breatheSpeaking {
    0%, 100% { opacity: 0.8; transform: scale(1.0); }
    25% { opacity: 1; transform: scale(1.12); }
    50% { opacity: 0.85; transform: scale(1.03); }
    75% { opacity: 1; transform: scale(1.1); }
  }

  /* Sound-ripple rings for "listening" - concentric circles that expand
     outward and fade, like the stage is picking up audio. Three copies
     staggered so a new ripple starts before the last one fully fades. */
  .ripple {
    position: absolute;
    inset: 40px;
    border-radius: 50%;
    border: 1px solid rgba(63,216,255,0.6);
    opacity: 0;
  }
  body.listening .ripple { animation: ripple 2.4s ease-out infinite; }
  body.listening .ripple:nth-child(2) { animation-delay: 0.8s; }
  body.listening .ripple:nth-child(3) { animation-delay: 1.6s; }
  @keyframes ripple {
    0% { transform: scale(0.85); opacity: 0.65; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  @keyframes bar {
    0%, 100% { height: 3px; }
    50% { height: 16px; }
  }

  /* --- State-driven speed/color/detail changes --- */
  body.idle #ringSweep { animation-duration: 6s; }
  body.idle #ringDashed { animation-duration: 30s; }
  body.idle #ringSegments { animation-duration: 26s; }
  body.idle #ringSatellites { animation-duration: 16s; }
  body.idle #glow { animation: breatheIdle 4s ease-in-out infinite, flicker 7s ease-in-out infinite; }
  body.idle .arc, body.idle .tick, body.idle .segment { stroke: #2a8fb0; }
  body.idle .satellite { fill: #2a8fb0; }

  body.listening #ringSweep { animation-duration: 1.4s; }
  body.listening #ringDashed { animation-duration: 10s; }
  body.listening #ringSegments { animation-duration: 8s; }
  body.listening #ringSatellites { animation-duration: 4s; }
  body.listening #glow { animation: breatheListening 1.1s ease-in-out infinite; background: radial-gradient(circle, rgba(63,216,255,0.5) 0%, rgba(63,216,255,0) 70%); }
  body.listening .arc, body.listening .tick, body.listening .segment { stroke: #3fd8ff; }
  body.listening .satellite { fill: #3fd8ff; }

  body.thinking #ringSweep { animation-duration: 0.7s; }
  body.thinking #ringDashed { animation-duration: 4s; }
  body.thinking #ringSegments { animation-duration: 2.5s; }
  body.thinking #ringSatellites { animation-duration: 2.5s; }
  body.thinking #glow { animation: breatheListening 0.6s ease-in-out infinite; background: radial-gradient(circle, rgba(160,120,255,0.5) 0%, rgba(160,120,255,0) 70%); }
  body.thinking .arc, body.thinking .tick, body.thinking .segment { stroke: #b48cff; }
  body.thinking .satellite { fill: #b48cff; }
  body.thinking #centerText { color: #ddd0ff; text-shadow: 0 0 8px rgba(180,140,255,0.9), 0 0 18px rgba(180,140,255,0.5); }
  /* "chase" - ticks light up in sequence rather than all at once, reads
     as data scanning past rather than a static ring merely spinning. */
  body.thinking .tick { animation: chase 1.6s linear infinite; animation-delay: var(--chase-delay, 0s); }
  @keyframes chase {
    0%, 92%, 100% { opacity: 0.35; }
    4% { opacity: 1; }
  }

  body.speaking #ringSweep { animation-duration: 0.9s; }
  body.speaking #ringDashed { animation-duration: 6s; }
  body.speaking #ringSegments { animation-duration: 5s; }
  body.speaking #ringSatellites { animation-duration: 3s; }
  body.speaking #glow { animation: breatheSpeaking 0.5s ease-in-out infinite; background: radial-gradient(circle, rgba(80,255,190,0.5) 0%, rgba(80,255,190,0) 70%); }
  body.speaking .arc, body.speaking .tick, body.speaking .segment { stroke: #58ffc8; }
  body.speaking .satellite { fill: #58ffc8; }
  body.speaking #centerText { color: #cfffec; text-shadow: 0 0 8px rgba(88,255,200,0.9), 0 0 18px rgba(88,255,200,0.5); }
  body.speaking #waveform { opacity: 1; }

  /* [ADDED 2026-09-01] "acting" - JARVIS is executing a real action
     (opening/closing an app, and eventually real mouse/keyboard control),
     not just generating a reply. Distinct amber/mechanical look (vs.
     "thinking"'s smooth purple) so it visually reads as "working on it"
     rather than "reasoning about it": ticks ring spins in short stepped
     bursts (steps() timing, not ease) to feel like a mechanism engaging,
     and the sweep ring spins the opposite direction from every other
     state as an extra at-a-glance cue. */
  @keyframes breatheActing {
    0%, 100% { opacity: 0.75; transform: scale(1.0); }
    30% { opacity: 1; transform: scale(1.1); }
    60% { opacity: 0.85; transform: scale(1.02); }
  }
  @keyframes tickGrind { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
  body.acting #ringSweep { animation-duration: 1.1s; animation-direction: reverse; }
  body.acting #ringDashed { animation-duration: 3s; }
  body.acting #ringTicks { animation: tickGrind 6s steps(24) infinite; }
  body.acting #ringSegments { animation: tickGrind 2s steps(8) infinite reverse; }
  body.acting #ringSatellites { animation-duration: 1.6s; }
  body.acting #glow { animation: breatheActing 0.9s ease-in-out infinite; background: radial-gradient(circle, rgba(255,176,56,0.5) 0%, rgba(255,176,56,0) 70%); }
  body.acting .arc, body.acting .tick, body.acting .segment { stroke: #ffb038; }
  body.acting .satellite { fill: #ffb038; }
  body.acting #centerText { color: #ffe7c2; text-shadow: 0 0 8px rgba(255,176,56,0.9), 0 0 18px rgba(255,176,56,0.5); }
</style>
</head>
<body class="idle">
  <div id="bgFallback"></div>
  <div id="stage">
    <div id="glow"></div>
    <div class="ripple"></div>
    <div class="ripple"></div>
    <div class="ripple"></div>

    <svg viewBox="0 0 200 200">
      <g id="ringTicks">
        <!-- 40 evenly spaced tick marks, like a gauge dial -->
        <g id="ticks"></g>
      </g>
    </svg>

    <svg viewBox="0 0 200 200">
      <g id="ringSatellites">
        <!-- small orbiting dots, staggered phase, like sub-processes ticking over -->
        <g id="satellites"></g>
      </g>
    </svg>

    <svg viewBox="0 0 200 200">
      <g id="ringDashed">
        <circle class="arc" cx="100" cy="100" r="78" stroke-width="3" stroke-dasharray="14 8" />
      </g>
    </svg>

    <svg viewBox="0 0 200 200">
      <g id="ringSegments">
        <!-- mechanical-iris style: short arc blocks with gaps, counter-rotating -->
        <g id="segments"></g>
      </g>
    </svg>

    <svg viewBox="0 0 200 200">
      <circle class="arc" cx="100" cy="100" r="62" stroke-width="1.5" opacity="0.5" />
    </svg>

    <svg viewBox="0 0 200 200">
      <g id="ringSweep">
        <path class="arc" d="M 100 22 A 78 78 0 0 1 178 100" stroke-width="3" stroke-linecap="round" />
        <path class="arc" d="M 100 178 A 78 78 0 0 1 22 100" stroke-width="3" stroke-linecap="round" />
      </g>
    </svg>

    <svg viewBox="0 0 200 200">
      <g id="core">
        <circle cx="100" cy="100" r="10" stroke-width="1.2" />
        <circle cx="100" cy="100" r="4" stroke-width="1" />
      </g>
    </svg>

    <div id="readout">SYS NOMINAL</div>
    <div id="waveform">
      <div class="bar" style="animation-delay:0s"></div>
      <div class="bar" style="animation-delay:0.1s"></div>
      <div class="bar" style="animation-delay:0.2s"></div>
      <div class="bar" style="animation-delay:0.15s"></div>
      <div class="bar" style="animation-delay:0.3s"></div>
      <div class="bar" style="animation-delay:0.05s"></div>
      <div class="bar" style="animation-delay:0.25s"></div>
    </div>
    <div id="centerText">J.A.R.V.I.S</div>
    <div id="stateLabel">idle</div>
  </div>

<script>
  // Native-shell detection: the real overlay (native-hud/) loads this
  // page with no window.chrome navigation UI and hosts it transparently;
  // a plain browser tab (e.g. opening hud.html directly to eyeball
  // changes) has no way to know that, so fall back to an opaque
  // background instead of rendering invisible rings on a white page.
  if (!window.chrome || !window.chrome.webview) {
    document.body.classList.add("browser-fallback");
  }

  // Build the tick ring in JS rather than hand-writing 40 <line> tags.
  const ticksGroup = document.getElementById("ticks");
  const TICK_COUNT = 40;
  for (let i = 0; i < TICK_COUNT; i++) {
    const angle = (i / TICK_COUNT) * 360;
    const tick = document.createElementNS("http://www.w3.org/2000/svg", "line");
    tick.setAttribute("class", "tick");
    tick.setAttribute("x1", "100");
    tick.setAttribute("y1", "8");
    tick.setAttribute("x2", "100");
    tick.setAttribute("y2", i % 5 === 0 ? "18" : "14");
    tick.setAttribute("stroke-width", i % 5 === 0 ? "2.5" : "1.5");
    tick.setAttribute("transform", `rotate(${angle} 100 100)`);
    tick.style.setProperty("--chase-delay", `${(i / TICK_COUNT) * 1.6}s`);
    ticksGroup.appendChild(tick);
  }

  // Short arc "segments" - a mechanical-iris ring made of gapped blocks
  // rather than one continuous dashed circle, layered between the dashed
  // ring and the static circle for depth.
  const segmentsGroup = document.getElementById("segments");
  const SEGMENT_COUNT = 10;
  const SEG_RADIUS = 70;
  for (let i = 0; i < SEGMENT_COUNT; i++) {
    const startAngle = (i / SEGMENT_COUNT) * 360;
    const sweep = 22; // degrees of arc per block, rest is gap
    const toRad = (deg) => (deg * Math.PI) / 180;
    const x1 = 100 + SEG_RADIUS * Math.cos(toRad(startAngle - 90));
    const y1 = 100 + SEG_RADIUS * Math.sin(toRad(startAngle - 90));
    const x2 = 100 + SEG_RADIUS * Math.cos(toRad(startAngle + sweep - 90));
    const y2 = 100 + SEG_RADIUS * Math.sin(toRad(startAngle + sweep - 90));
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("class", "segment");
    path.setAttribute("stroke-width", "2");
    path.setAttribute("d", `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${SEG_RADIUS} ${SEG_RADIUS} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`);
    segmentsGroup.appendChild(path);
  }

  // Orbiting satellite dots at two different radii - small, staggered,
  // gives the rings a sense of independent moving parts rather than one
  // monolithic spin.
  const satellitesGroup = document.getElementById("satellites");
  const SATELLITES = [
    { radius: 90, angle: 0, size: 2.4 },
    { radius: 90, angle: 150, size: 2.4 },
    { radius: 90, angle: 260, size: 2.4 },
    { radius: 50, angle: 60, size: 1.8 },
    { radius: 50, angle: 220, size: 1.8 },
  ];
  for (const s of SATELLITES) {
    const toRad = (deg) => (deg * Math.PI) / 180;
    const x = 100 + s.radius * Math.cos(toRad(s.angle - 90));
    const y = 100 + s.radius * Math.sin(toRad(s.angle - 90));
    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("class", "satellite");
    dot.setAttribute("cx", x.toFixed(2));
    dot.setAttribute("cy", y.toFixed(2));
    dot.setAttribute("r", String(s.size));
    satellitesGroup.appendChild(dot);
  }

  // [UPDATE 2026-09-03] Real readout text, replacing the old rotating
  // fake-variety words - per Gavin: "the text at the top isnt actaully
  // what hes doing its just for show, make it accurate." hud-server.ts's
  // /state now carries a real `activity` string when there's something
  // specific to report (see orchestrator.ts's onActionStart -
  // "Opening Notepad", "Searching the web for...", etc.) - shown
  // directly, no cycling, since it's real and doesn't need padding out
  // with fake variety. When there's nothing specific (a plain
  // conversational reply, or idle), a single honest static label per
  // state is shown instead - still real (accurately describes what's
  // actually happening in general terms), just not as specific as a
  // real activity description.
  const FALLBACK_LABELS = {
    idle: "Standing by",
    listening: "Listening",
    thinking: "Thinking",
    acting: "Working",
    speaking: "Responding",
  };
  function setReadout(state, activity) {
    document.getElementById("readout").textContent = activity || FALLBACK_LABELS[state] || FALLBACK_LABELS.idle;
  }
  setReadout("idle", null);

  // Polls the tiny local state server (see hud-server.ts) every 200ms and
  // swaps the body class - simple, real, and robust to the HUD window
  // being opened before or after the voice pipeline has emitted anything
  // (defaults to "idle" on a fetch failure rather than getting stuck on
  // whatever class happened to be set last).
  let lastState = "idle";
  let lastActivity = null;
  async function poll() {
    try {
      const res = await fetch("/state", { cache: "no-store" });
      const data = await res.json();
      if (data.state && (data.state !== lastState || data.activity !== lastActivity)) {
        const fallback = document.body.classList.contains("browser-fallback");
        document.body.className = data.state + (fallback ? " browser-fallback" : "");
        document.getElementById("stateLabel").textContent = data.state;
        setReadout(data.state, data.activity);
        lastState = data.state;
        lastActivity = data.activity;
      }
    } catch {
      // Server not up yet / briefly restarting - keep the last known
      // state rather than flashing to an error look.
    }
    setTimeout(poll, 200);
  }
  poll();
</script>
</body>
</html>
